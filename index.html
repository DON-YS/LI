    <style>
      :root {
        --bg: #07131f;
        --bg-soft: #0d1b2b;
        --panel: rgba(12, 25, 38, 0.62);
        --line: rgba(92, 157, 255, 0.22);
        --text: #eef7ff;
        --muted: #ccdff3;
        --primary: #0a66c2;
        --primary-2: #42a5f5;
        --primary-3: #8bd7ff;
        --shadow: rgba(10, 102, 194, 0.28);
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Tahoma, sans-serif;
        background:
          radial-gradient(circle at 18% 0%, rgba(10, 102, 194, 0.18), transparent 20%),
          radial-gradient(circle at 78% 10%, rgba(139, 215, 255, 0.14), transparent 18%),
          linear-gradient(135deg, #050c14 0%, #0d1b2b 38%, #050b12 100%);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
      }
      body::before, body::after {
        content: "";
        position: fixed;
        width: 20rem;
        height: 20rem;
        border-radius: 50%;
        filter: blur(120px);
        pointer-events: none;
      }
      body::before { background: rgba(10, 102, 194, 0.12); left: -6rem; top: 8rem; }
      body::after { background: rgba(139, 215, 255, 0.08); right: -5rem; bottom: 3rem; }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
      }
      .card {
        width: min(92vw, 760px);
        background: rgba(9, 17, 27, 0.76);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 30px 60px rgba(6, 15, 24, 0.45);
        overflow: hidden;
        position: relative;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line);
        background: rgba(12, 25, 38, 0.5);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: 700;
      }
      .logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        font-size: 1.2rem;
      }
      .content {
        padding: 2rem 1.6rem 2.4rem;
        text-align: center;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(10, 102, 194, 0.08);
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1.1;
        margin: 1.2rem 0 0.8rem;
      }
      p {
        margin: 0 auto 1.8rem;
        max-width: 580px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.8;
      }
      .cta {
        display: inline-block;
        text-decoration: none;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        padding: 0.95rem 1.4rem;
        border-radius: 18px;
        font-weight: 700;
        box-shadow: 0 20px 40px var(--shadow);
      }
      .cta:hover {
        filter: brightness(1.06);
      }
      @media (max-width: 640px) {
        .content { padding: 1.6rem 1rem 2rem; }
        .topbar { padding: 0.8rem 0.9rem; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">

          <span class="eyebrow">SHAHEEN GROUP</span>
        </div>
        <div class="content">

          <h1>Yousef Z. A. Shaheen</h1>

        </div>
      </div>
    </div>
